<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Recipes</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--accent:#c0603a;--accent-ink:#fff;--line:#e6ddd2;--text:#3a332c;--muted:#7a7064;--ok:#4f804f;--soft:#f3ede4;--note:#fbf0e4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--card:#272320;--accent:#e07b53;--accent-ink:#1d1a17;--line:#3b352f;--text:#ece5dc;--muted:#a89d90;--ok:#86b886;--soft:#312c27;--note:#382c22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a17;--card:#272320;--accent:#e07b53;--accent-ink:#1d1a17;--line:#3b352f;--text:#ece5dc;--muted:#a89d90;--ok:#86b886;--soft:#312c27;--note:#382c22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:auto;display:flex;gap:20px;align-items:flex-start}
.main{flex:1;min-width:0}
.side{width:240px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0}
.tabs{display:flex;background:var(--soft);border-radius:8px;padding:3px}
.tabs button{border:none;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.days button{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:6px 10px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font-size:13px}
.days button .t{font-size:11px;color:var(--muted)}
.days button.today .d::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:middle}
.days button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days button.active .t{color:inherit;opacity:.85}
.days button.active.today .d::after{background:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.rhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.recipe-title{font-size:19px;margin:0 0 2px}
.recipe-sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.swapnote{background:var(--note);border-radius:6px;padding:8px 10px;font-size:13px;margin:0 0 14px}
.link{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:13px}
details.ingr{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
details.ingr ul{margin:8px 0 2px;padding-left:20px;font-size:14px}
details.ingr li{margin:3px 0}
.progress{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.bar{height:4px;background:var(--soft);border-radius:2px;margin-bottom:14px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.step-box{border:1px solid var(--line);border-radius:8px;padding:16px}
.step-name{font-weight:600;font-size:16px;margin-bottom:6px}
.step-desc{font-size:15px;margin:0 0 12px;max-width:68ch}
.timer{font-size:34px;font-weight:700;color:var(--accent);margin-bottom:6px;font-variant-numeric:tabular-nums}
.timer.grace{color:var(--muted)}
.grace-note{font-size:13px;color:var(--muted);margin:0 0 10px}
.checkin-note{font-size:14px;background:var(--note);border-radius:6px;padding:8px 10px;margin:0 0 12px}
.quick-timer{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;font-size:16px}
.done-note{font-size:15px;margin:0 0 14px;max-width:68ch}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border:none;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:13px}
.btn.secondary{background:var(--soft);color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.fav-btn[aria-pressed="true"]{color:var(--accent);font-weight:600}
.settings-note{font-size:13px;color:var(--muted);margin:-4px 0 0 24px}
.settings-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:14px}
.settings-row:last-child{margin-bottom:0}
.settings-row input[type="checkbox"]{width:16px;height:16px;flex-shrink:0}
.settings-row select{max-width:100%;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.settings-section+.settings-section{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.settings-section h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.settings-section h5{margin:14px 0 8px;font-size:14px}
.side h3{font-size:14px;margin:0 0 10px}
.check-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.check-item .nm{flex:1}
.check-item .mn{color:var(--muted);font-size:12px;white-space:nowrap}
.check-item .box{width:16px;height:16px;border-radius:4px;border:1px solid var(--muted);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px}
.check-item.done .box{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.check-item.done .nm{color:var(--muted);text-decoration:line-through}
.check-item.current{font-weight:600}
.check-item.current .box{border-color:var(--accent);border-width:2px}
.side-total{display:flex;justify-content:space-between;font-size:13px;padding-top:10px;font-weight:600}
.done-label{color:var(--ok);font-size:15px;margin:6px 0 14px}
/* catalogue */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.filters input{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.filters select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.count{font-size:13px;color:var(--muted);margin:0 0 10px}
.item{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.item h3{margin:0;font-size:16px}
.badges{display:flex;gap:10px;align-items:baseline;flex-shrink:0}
.item .time{font-weight:700;color:var(--accent);white-space:nowrap;font-size:15px}
.item .cost{font-weight:700;color:var(--ok);white-space:nowrap;font-size:15px}
.item .meta{font-size:13px;color:var(--muted);margin:2px 0 8px}
.my-editor textarea,.my-editor input[type="text"],.my-editor input[type="number"],.my-editor select{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:inherit;color:inherit}
.my-editor textarea{resize:vertical}
.my-field{display:block;font-size:14px;font-weight:600;margin:12px 0 0}
.my-field.my-small{max-width:180px}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.my-row{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:flex-end}
.my-row .my-field{flex:1;min-width:140px}
.my-check{display:flex;align-items:center;gap:6px;font-size:14px;margin:8px 0 0;cursor:pointer}
.my-check input{width:16px;height:16px;flex-shrink:0}
.my-checks{display:flex;flex-wrap:wrap;gap:0 16px}
.my-label{font-size:14px;font-weight:600;margin:12px 0 0}
.my-hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.my-hint:empty,.my-error:empty{display:none}
.my-error{font-size:13px;color:var(--accent);font-weight:600;margin:6px 0 0}
.my-head{font-size:15px;margin:20px 0 4px}
.my-step{border:1px solid var(--line);border-radius:8px;padding:4px 14px 12px;margin:12px 0}
.my-step legend{font-size:13px;font-weight:600;color:var(--muted);padding:0 4px}
.my-step .controls{margin-top:10px}
.my-section{margin-top:18px}
.my-section summary{font-weight:600}
.my-actions{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.missing{font-size:13px;color:var(--accent);margin:2px 0 8px}
.have-all{font-size:13px;color:var(--ok);margin:2px 0 8px}
.item details{margin-bottom:10px;font-size:14px}
.item details summary{font-weight:500;font-size:13px;color:var(--muted)}
.item details h4{font-size:13px;margin:10px 0 4px}
.item details ul,.item details ol{margin:0;padding-left:20px}
.item details li{margin:3px 0}
.item .cost .was{color:var(--muted);font-weight:400;font-size:13px}
.swap-cat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.swap-cat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.swap-cat-head label,.swap-row label{display:flex;align-items:center;gap:8px;cursor:pointer}
.swap-cat input[type="checkbox"],.swap-row input[type="checkbox"]{width:16px;height:16px;flex-shrink:0}
.swap-cat details{margin-top:8px}
.swap-cat summary{font-weight:500;font-size:13px;color:var(--muted)}
.swap-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.swap-cat details .swap-row:first-of-type{margin-top:8px}
.swap-row select{max-width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px}
.swap-meta{display:block;flex-basis:100%;font-size:12px;color:var(--muted)}
.swap-cat-head .swap-meta{flex-basis:auto}
.swap-use{display:block;font-size:13px;color:var(--ok)}
.swap-tag{margin-left:6px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:var(--soft);font-size:12px;cursor:pointer}
.labels{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.recipe-sub+.labels{margin:-8px 0 14px}
.diet-label{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--ok);color:var(--ok)}
.serves-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px;margin:0 0 10px}
.serves-row input{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:center;font-size:15px}
.serves-step{min-width:36px;font-size:16px;padding:4px 10px}
.halal-note{font-size:13px;color:var(--muted);margin:0 0 14px}
.safety-note{font-size:13px;margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--muted)}
.recipe-safety{margin:0 0 14px}
.dish-desc{font-size:14px;margin:0 0 14px;max-width:68ch}
.item .dish-desc{margin:0 0 10px}
.sticker{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--note);color:var(--accent)}
.sticker.mine{background:var(--ok);color:var(--accent-ink)}
.choose-box{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.choose-q{font-weight:600;font-size:14px;margin-bottom:8px}
.choose-box .chips{margin-bottom:6px}
.choose-note{font-size:13px;color:var(--muted);margin:0}
.step-choice{font-size:13px;background:var(--note);border-radius:6px;padding:6px 10px;margin:0 0 12px}
.byo-group{margin:8px 0 0;font-size:14px}
.addon-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.addon-row input{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.addon-meta{display:block;font-size:12px;color:var(--muted)}
.addon-step{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--note);color:var(--accent);margin-bottom:6px}
.byo-group strong{display:block;font-size:13px}
/* shopping list */
.shop-days{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.shop-days label{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer}
.shop-days input{width:16px;height:16px}
.shop-summary{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;margin:0 0 12px}
.shop-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 4px}
.shop-item{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.shop-item>label{display:flex;gap:10px;align-items:flex-start;flex:1;cursor:pointer;min-width:0}
.shop-item input{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.shop-name{font-weight:600}
.shop-amt{color:var(--muted)}
.shop-for{display:block;font-size:12px;color:var(--muted)}
.shop-item.got .shop-name,.shop-item.got .shop-amt{text-decoration:line-through;color:var(--muted)}
.shop-add{display:flex;gap:8px;margin:14px 0 0}
.shop-add input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.shop-save{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.saved-lists{margin-top:18px;padding-top:4px;border-top:1px solid var(--line)}
.copy-box{display:block;width:100%;box-sizing:border-box;margin-top:8px;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit}
.shop-item .btn{padding:5px 10px;font-size:12px;flex-shrink:0}
.gather-head{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px}
.gather-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.gather-row input{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.gather-row.got>span{color:var(--muted);text-decoration:line-through}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:760px){.wrap{flex-direction:column}.side{width:100%;position:static}.rhead{flex-direction:column}}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
/* accessibility settings (colors are set from JS, see applyLook) */
:root[data-text="large"] body{zoom:1.2}
:root[data-text="xl"] body{zoom:1.4}
:root[data-readable] body{font-family:Verdana,Tahoma,"DejaVu Sans",system-ui,sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.75}
:root[data-contrast] .btn.secondary,:root[data-contrast] .chips button{border:1px solid var(--text)}
:root[data-contrast] .card,:root[data-contrast] .item,:root[data-contrast] .step-box{border-width:2px}
:root[data-reduce-motion] *,:root[data-reduce-motion] *::before,:root[data-reduce-motion] *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
</style></head>
<body>
<div class="wrap">
  <div class="main">
    <div class="topbar">
      <h1>Weekly Recipes</h1>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="tabs" role="tablist">
          <button role="tab" id="tabWeek" aria-selected="true">This week</button>
          <button role="tab" id="tabCat" aria-selected="false">All recipes</button>
          <button role="tab" id="tabShop" aria-selected="false">Shopping list</button>
          <button role="tab" id="tabMine" aria-selected="false">My recipes</button>
        </div>
        <button class="btn secondary" id="swapsBtn" aria-expanded="false" aria-controls="swapsPanel">Swaps</button>
        <button class="btn secondary" id="settingsBtn" aria-expanded="false" aria-controls="settingsPanel">Settings</button>
      </div>
    </div>
    <div class="card" id="swapsPanel" hidden style="margin-bottom:16px"></div>
    <div class="card" id="settingsPanel" hidden style="margin-bottom:16px">
      <h3 style="margin:0 0 12px;font-size:14px">Settings</h3>
      <section class="settings-section" aria-labelledby="cookingHead">
        <h4 id="cookingHead">Cooking</h4>
        <label class="settings-row"><input type="checkbox" id="skipTimersChk"> Skip step timers — just check off steps at your own pace</label>
        <label class="settings-row"><input type="checkbox" id="cheapModeChk"> Plan this week with the cheapest recipes (any day you've swapped yourself stays as you set it)</label>
        <label class="settings-row"><input type="checkbox" id="checkInChk"> Check in with a soft chime if a step without a timer takes much longer than usual</label>
        <label class="settings-row"><input type="checkbox" id="gatherFirstChk"> Start each recipe with a "get everything out" checklist of ingredients and tools</label>
        <label class="settings-row"><input type="checkbox" id="keepAwakeChk"> Keep the screen on while the app is open, so it doesn't lock mid-recipe</label>
        <p class="settings-note" id="keepAwakeNote" hidden></p>
      </section>
      <section class="settings-section" aria-labelledby="a11yHead">
        <h4 id="a11yHead">Accessibility</h4>
        <label class="settings-row">Text size <select id="textSizeSel"></select></label>
        <label class="settings-row">Light or dark <select id="themeSel"></select></label>
        <label class="settings-row">Colors <select id="colorModeSel"></select></label>
        <label class="settings-row"><input type="checkbox" id="highContrastChk"> High contrast — darker text and stronger outlines</label>
        <label class="settings-row"><input type="checkbox" id="readableFontChk"> Easier-to-read text — more space between letters, words, and lines</label>
        <label class="settings-row"><input type="checkbox" id="reduceMotionChk"> Reduce motion — turn off animations</label>
        <h5>Read aloud</h5>
        <label class="settings-row"><input type="checkbox" id="autoReadChk"> Read each new step out loud when you get to it</label>
        <label class="settings-row">Voice <select id="voiceSel"></select></label>
        <div class="settings-row"><label for="speechRateSel">Reading speed</label> <select id="speechRateSel"></select> <button class="btn secondary" id="testVoiceBtn">🔊 Test voice</button></div>
        <p class="settings-note" id="speechNote" style="margin-left:0">Every step also has a 🔊 Read step button, and the ingredient list has one too.</p>
      </section>
    </div>
    <div id="weekView">
      <div class="days" id="days"></div>
      <div class="card" id="recipeCard"></div>
    </div>
    <div id="catView" hidden></div>
    <div id="shopView" hidden></div>
    <div id="mineView" hidden></div>
  </div>
  <aside class="side" id="side">
    <h3>Checklist</h3>
    <div id="checklist"></div>
  </aside>
</div>
<script src="recipes.js"></script>
<script src="recipes-american.js"></script>
<script src="recipes-americas.js"></script>
<script src="recipes-asia.js"></script>
<script src="recipes-europe.js"></script>
<script src="recipes-africa-mideast.js"></script>
<script src="recipes-gluten-free.js"></script>
<script src="recipe-addons.js"></script>
<script src="recipe-diet-notes.js"></script>
<script src="servings.js"></script>
<script src="food-estimates.js"></script>
<script src="my-recipes-data.js"></script>
<script src="my-recipes.js"></script>
<script src="shopping-lists.js"></script>
<script>
/* Common ingredient swaps, grouped by food category. `match` finds the ingredient lines a swap
   applies to. Each swap has one or more replacement `options`; `save` is a rough per-serving
   saving in U.S. dollars (an estimate, like recipe costs). `kind` says why you'd use it, and
   `notIn` lists recipes where the swap would ruin the dish. */
const SWAP_CATEGORIES=[
 ["meat","Meat & fish"],
 ["veg","Vegetables"],
 ["fruit","Fruit"],
 ["herbs","Herbs & spices"],
 ["dairy","Dairy"],
 ["pantry","Pantry basics"]
];
const SWAP_KINDS={cheaper:"Cheaper",pantry:"Don't have it?"};
const SWAPS=[
 {id:"salmon",cat:"meat",kind:"cheaper",from:"Fresh salmon fillets",match:/salmon fillets/i,options:[
   {to:"frozen salmon fillets (thaw overnight in the fridge first)",save:2.50},
   {to:"canned salmon, drained (skip the oven: warm it in a pan 3–4 min with the oil and seasonings)",save:3.50},

const VOICE_QUALITY=[[/natural|neural|online/i,4],[/google/i,3],[/siri|enhanced|premium|samantha|daniel|karen/i,2],[/espeak|mbrola/i,-3]];

let englishVoices=[];
function loadVoices(){
  englishVoices=speechSynthesis.getVoices().filter(v=>/^en(-|_|$)/i.test(v.lang))
    .sort((a,b)=>voiceScore(b)-voiceScore(a)||a.name.localeCompare(b.name));

}

    ...englishVoices.map(v=>new Option(v.name,v.voiceURI)));

function toolsFor(r){
  const text=[...r.ingredients,...r.steps.map(s=>s.desc)].join(" ").toLowerCase();
  const tools=[];
  const oven=text.match(/oven to (\d+°f) \((\d+°c)\)/);
  if(oven)tools.push(`Oven (set to ${oven[1].toUpperCase()} / ${oven[2].toUpperCase()})`);
  else if(/\boven\b|broil/.test(text))tools.push("Oven or broiler");
  for(const group of TOOL_GROUPS){

  $("gatherDoneBtn").onclick=()=>{
    unlockAudio();gathering=false;startStep();renderRecipe();renderChecklist();
    if(settings.autoRead)speak(stepSpeech(r,0));
  };
  if(canSpeak)$("readGatherBtn").onclick=()=>speak(`Get everything out for ${r.title}. Ingredients: ${r.ingredients.join(". ")}. Tools: ${toolsFor(r).join(". ")}.`);
}

/* ---------- check-ins and quick timers ---------- */
// Steps without a countdown can still be forgotten. If one runs 2 minutes past its estimate,
// play a soft chime and ask whether the cook is still on it, then again every 5 minutes.
let stepStartedAt=0,checkInId=null,checkIns=0;
const stepUntimed=(r,i)=>settings.skipTimers||r.steps[i].timer===false;
function startStep(){
  clearInterval(checkInId);checkIns=0;stepStartedAt=Date.now();
  stopQuickTimer();
  const r=cur();
  if(settings.checkIn&&!gathering&&stepIdx<r.steps.length&&stepUntimed(r,stepIdx)&&stepMin(r,stepIdx))checkInId=setInterval(checkInTick,5000);
}
function checkInTick(){
  const r=cur(),over=(Date.now()-stepStartedAt)/1000-stepMin(r,stepIdx)*60;
  if(over<120+checkIns*300)return;
  checkIns++;softChime();renderRecipe();
  if(settings.autoRead)speak(`Still on ${r.steps[stepIdx].name}? Press Mark done when you're finished.`);
}
const checkInHtml=r=>checkIns?`<p class="checkin-note" role="status">Still on this step? It usually takes about ${stepMin(r,stepIdx)} min. Tap <strong>Mark done</strong> when you're finished, or take your time.</p>`:"";

// Short timers for times a step repeats, like "3 min per side" or frying "in batches ... 4–5 min".
// Ranges use the shorter time, so the cook checks before anything burns.
function quickTimesFor(st){
  const found=new Map();
  const add=(n,unit,what)=>{const sec=/^s/.test(unit)?+n:+n*60;if(sec>=30&&!found.has(sec+what))found.set(sec+what,{sec,what})};
  for(const m of st.desc.matchAll(/(\d+)(?:\s*[–-]\s*\d+)?\s*(min|minutes|seconds?)\s+(?:each\s+)?(?:per|a|each) (side|batch)/g))add(m[1],m[2],"per "+m[3]);
  if(!found.size&&/in batches|at a time|in two batches|per batch/i.test(st.desc)){
    const m=st.desc.match(/(\d+)(?:\s*[–-]\s*\d+)?\s*(min|minutes|seconds?)\b/);
    if(m)add(m[1],m[2],"per batch");
  }
  return [...found.values()];
}
let quick={left:0,endsAt:0,id:null,done:false};
function stopQuickTimer(){clearInterval(quick.id);quick={left:0,endsAt:0,id:null,done:false}}
function quickTimerHtml(st){
  const times=quickTimesFor(st);
  if(!times.length)return "";
  const label=t=>t.sec<60?`${t.sec} sec`:`${t.sec/60} min`;
  if(quick.id)return `<span class="quick-timer" aria-live="off">⏱ <span id="quickDisp">${fmt(quick.left)}</span><button class="btn secondary" id="quickStopBtn">Stop</button></span>`;
  return (quick.done?`<span class="quick-timer" role="status">⏱ Check it now</span>`:"")
    +times.map(t=>`<button class="btn secondary" data-quick="${t.sec}">⏱ ${label(t)} ${t.what}</button>`).join("");
}
function quickTick(){
  quick.left=secondsUntil(quick.endsAt);
  if(quick.left<=0){clearInterval(quick.id);quick={left:0,endsAt:0,id:null,done:true};beep();renderRecipe();return}
  const d=$("quickDisp");if(d)d.textContent=fmt(quick.left);
}
// Coming back to the tab shows the right time straight away instead of on the next tick.
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;
  if(running)tick();
  if(quick.id)quickTick();
});
function bindQuickTimer(){
  $("recipeCard").querySelectorAll("button[data-quick]").forEach(b=>b.onclick=()=>{
    unlockAudio();stopQuickTimer();
    quick.left=+b.dataset.quick;
    quick.endsAt=Date.now()+quick.left*1000;
    quick.id=setInterval(quickTick,1000);
    renderRecipe();
  });
  const stop=$("quickStopBtn");if(stop)stop.onclick=()=>{stopQuickTimer();renderRecipe()};
}

// The last screen reminds the cook to switch off what this recipe used and tidy up.
function wrapUpText(r){
  const text=r.steps.map(s=>s.desc).join(" ").toLowerCase();
  const heat=[];
  if(/skillet|grill pan|dry pan|\bpot\b|\bwok\b|\bfry|fried|sauté|\bsear|boil|simmer|stove|burner|(low|medium|high)(-\w+)? heat|oil to \d/.test(text))heat.push("the stove");
  if(/\boven\b|broil/.test(text))heat.push("the oven");
  const off=heat.length?`turn off ${heat.join(" and ")}, `:"";
  return `You did it! Before you sit down, ${off}put ingredients back in the fridge or pantry, and set your dishes and tools aside to wash. Enjoy your meal!`;
}

/* ---------- week ---------- */
function initDay(i){
  stopSpeaking();
  dayIdx=i;stepIdx=0;phase="task";running=false;clearInterval(timerId);
  openPanels={ingr:null,swaps:false,byo:null,diet:false};
  gathering=settings.gatherFirst;gathered=new Set();
  restartSteps();
}
// Back to step 1 (keeping the gather checklist as it is), e.g. after picking an add-on.
function restartSteps(){
  const r=cur();
  stepIdx=0;phase="task";running=false;clearInterval(timerId);
  stepStatus=r.steps.map(()=>"pending");stepStatus[0]="current";
  secLeft=stepMin(r,0)*60;
  startStep();
  renderDays();renderRecipe();renderChecklist();
}
function renderDays(){
  const el=$("days");el.innerHTML="";
  const plan=planArr();
  DAYS.forEach((d,i)=>{

    b.innerHTML=`<span class="d">${d}</span><span class="t">${cookTotal(r)?fmtMin(cookTotal(r)):"—"}</span>${prepTotal(r)?`<span class="t">+ ${prepText(r)} prep</span>`:""}`;
    b.className=(i===dayIdx?"active ":"")+(i===TODAY?"today":"");
    b.title=`${DAY_NAMES[i]}${i===TODAY?" (today)":""}: ${plainText(r.title)}`;

  });
}
// Overnight soaks are done the night before, so they never count toward "ready around".
function secondsLeft(){
  const r=cur();if(stepIdx>=r.steps.length)return 0;
  let s=phase==="task"&&!r.steps[stepIdx].overnight?secLeft:0;
  for(let i=stepIdx+1;i<r.steps.length;i++)if(!r.steps[i].overnight)s+=stepMin(r,i)*60;
  return s;
}
const progressPct=()=>Math.round(100*(1-secondsLeft()/(readyTotal(cur())*60)));
function progressText(){
  if(!readyTotal(cur()))return "";
  const left=fmtMin(Math.ceil(secondsLeft()/60));
  if(cur().steps[stepIdx].overnight)return `Then about ${left} of cooking`;
  const ready=new Date(Date.now()+secondsLeft()*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  return `About ${left} left · ready around ${ready}`;
}

          <div class="step-name">${st.name}</div>
          <p class="step-desc">${st.desc}</p>
          ${st.by?`<p class="step-choice">${stepChoiceText(r,st)} (${stepMin(r,stepIdx)} min). Change it above.</p>`:""}
          ${stepNotesHtml(st)}
          <div class="timer ${phase==="grace"?"grace":""}" id="timerDisp" aria-live="off">${fmt(secLeft)}</div>

// Picking a different doneness restarts the current step's timer if that step depends on it.
function pickChoice(r,cid,idx){
  settings.choices[r.id+"."+cid]=idx;saveSettings();
  if(r.steps[stepIdx]?.by===cid){clearInterval(timerId);running=false;phase="task";secLeft=stepMin(r,stepIdx)*60}
  renderDays();renderRecipe();renderChecklist();
}
function renderChecklist(){
  const r=cur(),el=$("checklist");el.innerHTML="";
  if(settings.gatherFirst||gathering){
    const g=document.createElement("div");
    g.className="check-item "+(gathering?"current":"done");
    g.innerHTML=`<div class="box">${gathering?"":"✓"}</div><div class="nm">Get everything out</div><div class="mn">no timer</div>`;
    el.appendChild(g);
  }
  r.steps.forEach((st,i)=>{
    const d=document.createElement("div"),current=stepStatus[i]==="current"&&!gathering;
    d.className="check-item "+(stepStatus[i]==="done"?"done":"")+(current?" current":"");
    d.innerHTML=`<div class="box">${stepStatus[i]==="done"?"✓":""}</div><div class="nm">${st.name}</div><div class="mn" ${st.timer===false?'title="No timer for this step"':""}>${st.prep?`prep · ${stepPrepText(st)}`:stepMin(r,i)?`${st.timer===false?"~":""}${stepMin(r,i)} min`:""}</div>`;
    el.appendChild(d);
  });
  if(cookTotal(r)){
    const t=document.createElement("div");t.className="side-total";
    t.innerHTML=`<span>Cooking</span><span>${fmtMin(cookTotal(r))}</span>`;el.appendChild(t);
  }
  if(prepTotal(r)){
    const p=document.createElement("div");p.className="side-total";
    p.innerHTML=`<span>Prep ahead</span><span>${prepText(r)}</span>`;el.appendChild(p);
  }
}
function toggleRun(){
  unlockAudio();
  running=!running;
  clearInterval(timerId);
  if(running){endsAt=Date.now()+secLeft*1000;timerId=setInterval(tick,1000)}
  else secLeft=Math.max(0,secondsUntil(endsAt));
  renderRecipe();
}
// Timers count down to a clock time rather than counting ticks, because browsers run background
// tabs' intervals rarely (Chrome: about once a minute), which made timers fall far behind.
function tick(){
  const left=secondsUntil(endsAt);
  if(left<0){
    if(phase==="task"){
      phase="grace";endsAt+=120*1000;secLeft=Math.max(0,secondsUntil(endsAt));beep();renderRecipe();
      if(settings.autoRead)speak("Time's up. Take up to 2 more minutes if you need them, then press Done.");
      return;
    }
    else{completeStep();return}
  }
  secLeft=left;
  const t=$("timerDisp");if(t&&view==="week"){
    t.textContent=fmt(secLeft);
    const l=$("leftTxt");if(l)l.textContent=progressText();
    const b=$("barFill");if(b)b.style.width=progressPct()+"%";
  }
}
function resetTimer(){
  running=false;clearInterval(timerId);phase="task";
  secLeft=stepMin(cur(),stepIdx)*60;renderRecipe();
}
function completeStep(){
  clearInterval(timerId);running=false;
  unlockAudio();
  stepStatus[stepIdx]="done";stepIdx++;phase="task";startStep();
  const r=cur();
  if(stepIdx<r.steps.length){stepStatus[stepIdx]="current";secLeft=stepMin(r,stepIdx)*60}
  renderRecipe();renderChecklist();
  if(settings.autoRead)speak(stepIdx<r.steps.length?stepSpeech(r,stepIdx):wrapUpText(r));
}

function renderList(){

    if(cat.prep&&cat.prep!=="none"&&(prepTotal(r)>+cat.prep||r.steps.some(s=>s.prep&&s.overnight)))return false;
    if(cat.maxCost&&(r.cost===null||effectiveCost(r)>=cat.maxCost))return false;
    if(cat.diet&&!r.diet.includes(cat.diet)&&!(cat.dietAdapt&&canBeMade(r,cat.diet)))return false;
    if(cat.cuisine&&r.cuisine!==cat.cuisine)return false;
    if(cat.show==="fav"&&!favorites.has(r.id))return false;
    if(cat.show==="byo"&&!r.byo)return false;
    if(cat.show==="mine"&&!r.mine)return false;
    if(cat.meal&&!r.meal.includes(cat.meal))return false;
    if(cat.type&&!r.tags.includes(cat.type))return false;
    return textHasAll(SEARCH_TEXT[r.id],words);
  });
  // Recipes whose name, meal, or dish type matches the search come before ones that only mention it.
  const withMissing=list.map(r=>({r,missing:haveTokens.length?missingFor(r,haveTokens):null,
    weak:words.length>0&&!textHasAll(TYPE_TEXT[r.id],words)}));
  withMissing.sort((a,b)=>{
    if(a.weak!==b.weak)return a.weak?1:-1;
    if(cat.diet){
      const d=a.r.diet.includes(cat.diet)-b.r.diet.includes(cat.diet);
      if(d)return -d;
    }
    if(haveTokens.length){
      const d=a.missing.length-b.missing.length;
      if(d)return d;
    }
    if(cat.sort==="az")return a.r.title.localeCompare(b.r.title);
    if(cat.sort==="long")return cookTotal(b.r)-cookTotal(a.r)||a.r.title.localeCompare(b.r.title);
    return cookTotal(a.r)-cookTotal(b.r)||a.r.title.localeCompare(b.r.title);
  });
  $("dietAdaptRow").hidden=!cat.diet;
  $("count").textContent=`${withMissing.length} ${withMissing.length===1?"recipe":"recipes"}`;
  const d=cat.day,L=$("list"),plan=planArr();
  if(!withMissing.length){
    const msg=cat.show==="fav"&&!favorites.size
      ?"No favorites yet. Tap ♡ Favorite on any recipe to save it here."
      :cat.show==="mine"&&!RECIPES.some(r=>r.mine)?"No recipes of your own yet. Make one in the My recipes tab, or press Copy and edit on any recipe here."
      :"No recipes match. Try a different word, or loosen the meal, dish type, diet, cuisine, cost, time, or prep filters.";
    L.innerHTML=`<div class="empty">${msg}</div>`;return;
  }
  L.innerHTML=withMissing.map(({r,missing})=>{
    const onDays=plan.map((id,i)=>id===r.id?DAYS[i]:null).filter(Boolean);
    const already=plan[d]===r.id;
    const pantryNote=haveTokens.length?(missing.length?`<p class="missing">Missing: ${missing.join(", ")}</p>`:`<p class="have-all">You have everything for this one.</p>`):"";
    const mine=activeSwapsFor(r).length,avail=swapsFor(r).length;
    const sticker=mine?`<span class="sticker mine">Uses your swaps (${mine})</span>`:avail?`<span class="sticker">${avail} ${avail===1?"swap":"swaps"} available</span>`:"";
    const cost=effectiveCost(r);
    return `<article class="item">
      <div class="item-top"><h3>${r.title}</h3><span class="badges">${timeText(r)?`<span class="time">${timeText(r)}</span>`:""}${cost===null?"":`<span class="cost">${cost<r.cost?`<s class="was">${r.cost.toFixed(2)}</s> `:""}${fmtCost(cost)}</span>`}</span></div>
      <p class="meta">${[r.cuisine,mealTypeText(r),`Serves ${r.serves}`,r.steps.length?`${r.steps.length} steps`:"no steps",caloriesText(r),onDays.length?`on your plan for ${onDays.join(", ")}`:""].filter(Boolean).join(" · ")}</p>
      ${r.desc?`<p class="dish-desc">${r.desc}</p>`:""}
      <div class="labels">${dietLabelsHtml(r)}${cat.diet&&!r.diet.includes(cat.diet)?`<span class="sticker">Can be made ${DIET_NAMES[cat.diet]}</span>`:""}${sticker}</div>
      ${pantryNote}
      <details><summary>Ingredients and steps</summary>
        <h4>Ingredients</h4><ul>${ingredientsHtml(r,false)}</ul>
        ${r.byo?`<h4>Make it your own</h4>${r.addons?`<p class="byo-group"><strong>Options with their own steps</strong>${r.addons.map(a=>a.label).join(" · ")}</p>`:""}${byoHtml(r)}`:""}
        ${(r.choose||[]).map(c=>`<h4>${c.label}</h4><ul>${c.options.map(o=>`<li><strong>${o.label}${o.undercooked?" (not fully cooked)":""}:</strong> ${o.note}</li>`).join("")}</ul>`).join("")}
        ${r.safety?safetyNoteHtml(r.safety):""}
        ${dietNotesFor(r).length?`<h4>${dietNotesTitle(dietNotesFor(r))}</h4>${dietNotesBody(dietNotesFor(r))}`:""}
        ${r.steps.length?`<h4>Steps</h4><ol>${catalogStepsHtml(r)}</ol>`:""}
      </details>
      <div class="controls">
        <button class="btn" data-id="${r.id}" ${already?"disabled":""}>${already?`Already planned for ${DAY_NAMES[d]}`:`Cook this on ${DAY_NAMES[d]}`}</button>
        ${favButtonHtml(r)}
        ${r.mine?`<button class="btn secondary" data-edit="${r.id}">Edit</button>`:""}
        <button class="btn secondary" data-copy="${r.id}">Copy and edit</button>
      </div>
    </article>`;
  }).join("");
  bindFavButtons(L,renderList);
  bindEditButtons(L);
  L.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{
    overrides[d]=b.dataset.id;saveOverrides();
    dayIdx=d;setView("week");initDay(d);window.scrollTo(0,0);
  });
}

/* ---------- shopping list ---------- */
// Builds one combined list from the planned recipes. Each ingredient line is split into single
// ingredients, named by the recipe's pantry keyword when one matches, and amounts that share a
// unit are added together.
const SHOP_KEY="weekly-recipes-shopping";
let shop={days:[0,1,2,3,4,5,6],have:[...STAPLES],checked:[],extras:[]};
try{
  const s=JSON.parse(localStorage.getItem(SHOP_KEY)||"null");
  if(s&&typeof s==="object"){
    if(Array.isArray(s.days))shop.days=s.days.filter(d=>Number.isInteger(d)&&d>=0&&d<7);
    for(const key of ["have","checked"])if(Array.isArray(s[key]))shop[key]=s[key].filter(x=>typeof x==="string");
    shop.extras=cleanExtras(s.extras);
  }
}catch(e){}
function saveShop(){try{localStorage.setItem(SHOP_KEY,JSON.stringify(shop))}catch(e){}}

// Checked in order; the first match wins.
const SHOP_SECTIONS=[
 ["Frozen",/frozen/],
 ["Pantry & spices",/broth|stock|sauce|paste|powder|dried|flour|meal\b|oil|vinegar|sugar|syrup|honey|spice|seasoning|flakes|seeds|starch|canned|can \(|coconut milk|evaporated|condensed|noodle|pasta|spaghetti|macaroni|lasagna|\brice|oats|couscous|bulgur|freekeh|lentil|beans|chickpea|pigeon peas|tahini|peanut|\bnuts?\b|walnut|pecan|raisin|chocolate|cocoa|vanilla|baking|yeast|salt|^pepper$|black pepper|cumin|cinnamon|paprika|turmeric|oregano|bouillon|ketchup|mustard|mayo|salsa|kimchi|olives|capers|pickles/],
 ["Bread & tortillas",/bread|bun|roll\b|rolls|tortilla|tostada|pita|naan|roti|injera|baguette|english muffin|biscuit|dough|wrapper|rice paper/],
 ["Meat & fish",/chicken|beef|steak|lamb|pork|turkey|sausage|bacon|ham\b|pepperoni|shrimp|fish|salmon|tuna|cod\b|catfish|tilapia|meat|ribs|chuck|sirloin|ribeye|wings|saltfish|chorizo|chicharr/],
 ["Fruits, vegetables & herbs",/onion|garlic|ginger|potato|carrot|celery|pepper|tomato|lettuce|romaine|spinach|kale|cabbage|broccoli|cauliflower|zucchini|squash|pumpkin|eggplant|cucumber|mushroom|sprouts|snap peas|green beans|avocado|lemon|lime|orange|apple|banana|mango|pineapple|plantain|yuca|cassava|beet|radish|daikon|turnip|okra|chayote|papaya|corn|basil|cilantro|parsley|mint|dill|thyme|rosemary|lemongrass|scallion|shallot|leek|chile|chili|jalape|habanero|scotch bonnet|collard|greens|asparagus|berr|vegetable|herb|tofu|fruit|peas|pear|shiitake|galangal|calamansi|ackee/],
 ["Dairy & eggs",/milk|butter|cream|cheese|parmesan|mozzarella|cheddar|feta|ricotta|paneer|yogurt|egg|gruy|queso|kashk|ghee|jack|provolone|swiss|ranch/],
 ["Pantry & spices",/./]
];
// The order sections appear in, roughly how a store is laid out.
const SHOP_ORDER=["Fruits, vegetables & herbs","Meat & fish","Dairy & eggs","Bread & tortillas","Frozen","Pantry & spices"];
const shopSection=name=>SHOP_SECTIONS.find(([,re])=>re.test(name.toLowerCase()))[0];
const FRACTIONS={"½":1/2,"¼":1/4,"¾":3/4,"⅓":1/3,"⅔":2/3,"⅛":1/8};
const UNIT_RE=/^(kg|g|ml|l|cm|pieces?|cups?|tbsp|tsp|cans?|lb|oz|cloves?|slices?|bunch(?:es)?|heads?|stalks?|sprigs?|packs?|packets?|sheets?|blocks?|ears?)\b\.?\s*/i;
const SIZE_RE=/^(large|medium|small|big|very|thick|thin|fresh|whole)\s+/i;
const escapeRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
// Different names for the same thing on the shelf.
const SHOP_ALIASES={"black pepper":"pepper","kosher salt":"salt","table salt":"salt","coarse salt":"salt","sea salt":"salt"};
function itemKey(name){
  const key=name.toLowerCase().split(" ").map(singular).join(" ");
  return SHOP_ALIASES[key]||(/\bwater$/.test(key)?"water":key);
}
const PREP_RE=/,\s*(?:finely |thinly |roughly |very |lightly |well )?(?:minced|diced|chopped|sliced|drained|peeled|divided|cut|grated|halved|thawed|rinsed|softened|melted|crumbled|shredded|beaten|cubed|trimmed|cored|seeded|smashed|soaked|quartered|torn|julienned|crushed|stirred|pierced|toasted|boiled|squeezed|separated|broken|at room|with (?:their|its)|in |into |about |plus |cooled|warm|cold|hot|tied|picked|ground and|browned|blended|slit|snipped|left|optional)[^,]*/gi;
// Words left over from notes, not things to buy.
const NOT_AN_ITEM=/^(?:fresh|fry|soft|sprinkle|topping|green|white|red|brown|medium-?|metal|each|more|extra)$/;
// Drops notes and prep words: "2 garlic cloves, minced (or 1 tsp powder), for the sauce" -> "2 garlic cloves".
function cleanPart(part){
  return part.replace(/\([^)]*\)/g,"").replace(/^(optional|to serve)[^:]*:\s*/i,"")
    .replace(/^(?:a |about |a big bowl of |a few |pinch of |a pinch of |large pinch of |(?:a |1 )?(?:large |small )?handful(?: of)? )/i,"")
    .split(/,?\s*\b(?:to (?:serve|taste|finish|scoop|dip|garnish)|then more|as needed|for (?:the|frying|dipping|serving|garnish|soaking|croque)|if\b|so\b)/i)[0]
    .replace(PREP_RE,"").replace(/\s+/g," ").trim();
}

// "Sauce: 3 tbsp soy sauce, 1 tsp sesame oil" -> ["3 tbsp soy sauce", "1 tsp sesame oil"].
function ingredientParts(line){
  const label=line.match(/^([^:\d]*):\s*/);
  const body=label?line.slice(label[0].length):line;
  return body.split(/,\s*(?=(?:and\s+)?[\d½¼¾⅓⅔⅛]|pinch\b)/i).map(t=>t.replace(/^and\s+/i,"").trim()).filter(Boolean);
}
// Pantry keywords named in a part, longest first so "garlic powder" wins over "garlic".
function keywordsIn(part,pantry){
  let text=part.toLowerCase();const found=[];
  for(const k of [...pantry].sort((a,b)=>b.length-a.length)){
    const re=new RegExp(`\\b${escapeRe(singular(k.toLowerCase()))}(?:s|es)?\\b`,"g");
    // A plain "pepper" keyword must not swallow bell peppers or chiles.
    if(isStaple(k)&&/(bell|red|green|yellow|chili|cayenne|sweet|hot|banana|jalape)\w*\s+pepper/.test(text))continue;
    if(re.test(text)){found.push(k);text=text.replace(re," ")}
  }
  return found;
}
// Name for a part no pantry keyword matched: "2 tbsp oil, for frying" -> "oil".
function fallbackNames(part){
  let t=part.replace(/^[\d½¼¾⅓⅔⅛.\s–-]+/,"").replace(SIZE_RE,"").replace(UNIT_RE,"");
  while(SIZE_RE.test(t))t=t.replace(SIZE_RE,"");
  return t.split(/,|\band\b/i).map(n=>n.trim().toLowerCase()).filter(n=>/[a-z]/.test(n)&&!NOT_AN_ITEM.test(n));
}
// "200 g spaghetti" -> {qty:200, unit:"g"}; "4 garlic cloves" -> {qty:4, unit:"garlic clove"}.
// A count whose words don't name the item ("6 bone-in, skin-on chicken thighs") is counted in the item's name.
function parseAmount(part,name){
  const m=part.match(/^(\d+(?:\.\d+)?)?\s*([½¼¾⅓⅔⅛])?(\s*[–-]\s*\d+)?\s*/);
  if(!m||(!m[1]&&!m[2])||m[3])return null;
  const qty=(m[1]?+m[1]:0)+(m[2]?FRACTIONS[m[2]]:0);
  let rest=part.slice(m[0].length);
  const unit=rest.match(UNIT_RE);
  if(unit){
    const u=unit[1].toLowerCase();
    return {qty,unit:u==="l"?"L":singular(u)};
  }
  while(SIZE_RE.test(rest))rest=rest.replace(SIZE_RE,"");
  const noun=itemKey(rest.split(",")[0].trim()),key=itemKey(name);
  return {qty,unit:noun.includes(key)?noun:key};
}
function fmtQty(q,unit){
  if(unit==="g"||unit==="ml")return String(Math.round(q));
  const whole=Math.floor(q+1e-9),frac=q-whole;
  const sym=Object.entries(FRACTIONS).find(([,v])=>Math.abs(v-frac)<0.02);
  if(frac<0.02)return String(whole);
  if(sym)return (whole?whole:"")+sym[0];
  return (Math.round(q*10)/10).toString();
}
const fmtUnit=(q,unit)=>q>1&&!["g","ml","L","kg","lb","oz","tbsp","tsp"].includes(unit)?unit.replace(/(\w+)$/,plural):unit;
function amountText(uses){
  const sums=new Map();let unmeasured=false;
  for(const u of uses){if(u)sums.set(u.unit,(sums.get(u.unit)||0)+u.qty);else unmeasured=true}
  const parts=[...sums].map(([unit,q])=>`${fmtQty(q,unit)} ${fmtUnit(q,unit)}`);
  return parts.length?parts.join(" + ")+(unmeasured?" + more":""):"";
}
function shoppingItems(){
  const plan=planArr(),items=new Map();
  for(const d of [...shop.days].sort()){
    const r=withAddons(byId[plan[d]]),swaps=activeSwapsFor(r);
    for(const line of r.ingredients)for(const rawPart of ingredientParts(line)){
      const part=cleanPart(rawPart),keys=keywordsIn(part,r.pantry);
      const names=keys.length?keys:fallbackNames(part);
      for(const name of names){
        const key=itemKey(name);
        if(!items.has(key))items.set(key,{key,name:name[0].toUpperCase()+name.slice(1),uses:[],days:new Set(),swaps:new Set()});
        const item=items.get(key);
        item.uses.push(names.length===1?parseAmount(part,name):null);
        item.days.add(d);
        swaps.filter(s=>s.match.test(rawPart)).forEach(s=>item.swaps.add(`Swap on: ${chosenOption(s).to}`));
      }
    }
  }
  return [...items.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
const shopForText=item=>`for ${[...item.days].map(d=>DAYS[d]).join(", ")}`+[...item.swaps].map(t=>` · ${t}`).join("");
function shopItemHtml(item,had){
  const got=shop.checked.includes(item.key),amount=amountText(item.uses),forText=shopForText(item),key=escapeHtml(item.key);
  if(had)return `<div class="shop-item"><span style="flex:1"><span class="shop-name">${item.name}</span><span class="shop-for">${forText}</span></span>
    <button class="btn secondary" data-need="${key}">Need it</button></div>`;
  return `<div class="shop-item ${got?"got":""}">
    <label><input type="checkbox" data-check="${key}" ${got?"checked":""}>
      <span><span class="shop-name">${item.name}</span>${amount?` <span class="shop-amt">— ${amount}</span>`:""}<span class="shop-for">${forText}</span></span></label>
    <button class="btn secondary" data-have="${key}">Have it</button>
  </div>`;
}
function renderShop(){
  if(openListId&&savedList(openListId))return renderSavedList();
  openListId=null;
  const el=$("shopView"),plan=planArr(),items=shoppingItems();
  // Keep "Already have" open across redraws so several items can be moved back in a row.
  const haveOpen=$("haveBox")?.open;
  const need=items.filter(i=>!shop.have.includes(i.key)),had=items.filter(i=>shop.have.includes(i.key));
  const extras=shop.extras.map(extraRow),total=need.length+extras.length;
  const got=[...need,...extras].filter(i=>shop.checked.includes(i.key)).length;
  const cost=shop.days.reduce((a,d)=>{const r=withAddons(byId[plan[d]]);return a+(effectiveCost(r)??0)*r.serves},0);
  const sections=SHOP_ORDER.map(title=>[title,need.filter(i=>shopSection(i.name)===title),extras.filter(x=>x.section===title)])
    .filter(([,fromRecipes,own])=>fromRecipes.length||own.length);
  el.innerHTML=`<div class="card">
    <h2 class="recipe-title">Shopping list</h2>
    <p class="recipe-sub">Everything you need for the days you pick, added up across recipes. Tap <strong>Have it</strong> for things already in your kitchen, and add anything else you need at the bottom.</p>
    ${shopNotice?`<p class="swapnote" role="status">${shopNotice}</p>`:""}
    <div class="shop-days" role="group" aria-label="Days to shop for">
      ${DAYS.map((d,i)=>`<label title="${byId[plan[i]].title}"><input type="checkbox" data-day="${i}" ${shop.days.includes(i)?"checked":""}> ${d}: ${byId[plan[i]].title}</label>`).join("")}
    </div>
    ${total?`<div class="shop-summary">
      <span><strong>${got} of ${total}</strong> in your cart${shop.days.length?` · about $${cost.toFixed(2)} for these meals (rough estimate)`:""}</span>
      ${got?`<button class="btn secondary" id="clearChecksBtn">Clear checks</button>`:""}
    </div>`:""}
    ${shop.days.length||extras.length?"":`<div class="empty">Pick at least one day above to build your list, or add your own items below.</div>`}
    ${total&&got===total?`<p class="have-all">Everything's in your cart. Happy cooking!</p>`:""}
    ${sections.map(([title,fromRecipes,own])=>`<section class="shop-section"><h3>${title}</h3>${fromRecipes.map(i=>shopItemHtml(i,false)).join("")}${own.map(x=>listRowHtml(x,shop.checked.includes(x.key),"data-check","data-extra-remove")).join("")}</section>`).join("")}
    ${addItemFormHtml("addExtraForm")}
    ${had.length?`<details class="ingr" id="haveBox" style="margin-top:16px" ${haveOpen?"open":""}><summary>Already have (${had.length})</summary>
      <p class="recipe-sub" style="margin:6px 0 4px">These stay here every week until you tap Need it. Glance over them before you shop.</p>
      ${had.map(i=>shopItemHtml(i,true)).join("")}</details>`:""}
    ${total?`<div class="shop-save my-editor">
      <label class="my-field">Save a copy of this list as<input type="text" id="saveListName" maxlength="${LIST_LIMITS.name}" value="${escapeHtml(weekLabel())}"></label>
      <div class="controls" style="margin-top:8px"><button class="btn" id="saveListBtn">Save this list</button><button class="btn secondary" id="copyListBtn">Copy as text</button></div>
    </div>`:""}
    ${savedListsHtml()}
  </div>`;
  el.querySelectorAll("input[data-day]").forEach(c=>c.onchange=()=>{
    const d=+c.dataset.day;
    shop.days=c.checked?[...shop.days,d]:shop.days.filter(x=>x!==d);
    saveShop();renderShop();
  });
  el.querySelectorAll("input[data-check]").forEach(c=>c.onchange=()=>{
    const k=c.dataset.check;
    shop.checked=c.checked?[...shop.checked,k]:shop.checked.filter(x=>x!==k);
    saveShop();renderShop();
  });
  el.querySelectorAll("button[data-have]").forEach(b=>b.onclick=()=>{shop.have.push(b.dataset.have);saveShop();renderShop()});
  el.querySelectorAll("button[data-need]").forEach(b=>b.onclick=()=>{shop.have=shop.have.filter(x=>x!==b.dataset.need);saveShop();renderShop()});
  if(got)$("clearChecksBtn").onclick=()=>{shop.checked=[];saveShop();renderShop()};
  bindCurrentListExtras(el);
}

renderSwapsPanel();
initDay(TODAY);
updateWakeLock();

document.addEventListener("click",updateWakeLock,{once:true});
